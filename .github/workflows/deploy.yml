name: CI/CD - Build, Push to ECR and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: adecloud/zeetafin
  BE_IMAGE: zeetafin-be
  FE_IMAGE: zeetafin-fe

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file phase2_docker/Application/ZeetaFin-BE/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_IMAGE-$IMAGE_TAG" \
            phase2_docker/Application/ZeetaFin-BE
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BE_IMAGE-$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file phase2_docker/Application/ZeetaFin-FE/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_IMAGE-$IMAGE_TAG" \
            phase2_docker/Application/ZeetaFin-FE
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$FE_IMAGE-$IMAGE_TAG"

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "phase3_cicd/deploy/"
          target: /tmp/phase3-deploy
          overwrite: true

      - name: Deploy new containers to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,POSTGRES_PASSWORD,JWT_SECRET
          script: bash /tmp/phase3-deploy/remote-deploy.sh

      - name: Verify application is accessible
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          curl -fsS "http://${{ secrets.EC2_HOST }}/" >/dev/null
          echo "Frontend is reachable on http://${{ secrets.EC2_HOST }}/"
          curl -fsS "http://${{ secrets.EC2_HOST }}/api/docs" >/dev/null
          echo "Backend API is reachable on http://${{ secrets.EC2_HOST }}/api/docs"
